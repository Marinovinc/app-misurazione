[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misura"
version = "0.0.0"
description = "Nucleo metrologico: misure da immagini con incertezza e provenienza di prima classe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    # opencv-contrib-python: usato dal Passo 5 (riferimento ArUco). Installato lì.
    "opencv-contrib-python>=4.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
misura = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_explicit = false
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
